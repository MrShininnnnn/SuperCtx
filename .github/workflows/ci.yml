name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned: ubuntu-24.04 provides every Python in the 3.9-3.12 matrix below;
    # ubuntu-latest moved to 26.04, which has no Python 3.9 build for setup-python.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Migration-safety tests run released clients extracted from tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .[test]

      - name: Run tests
        run: python -m pytest tests/ -v
