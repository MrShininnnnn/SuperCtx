# SuperCtx conventions registry
#
# Maps well-known context-file PATHS to the tools that read them. Identity comes from the
# path convention, NOT from file contents, and one path may serve many tools (many-to-many).
#
# Every upstream tool convention cites an official `source` and a `verified` date so the mapping
# is auditable and can be re-checked as conventions change. SuperCtx-supported local variants must
# cite the issue or PR that introduced the variant and must state that they are SuperCtx import
# paths, not upstream tool conventions.
#
# `kind`:
#   "instruction-file" — a single Markdown instructions file. IN SCOPE for v0.1 sync.
#   "folder"           — a tool directory (skills/config). Recorded for later; OUT OF SCOPE in v0.1.

# ---------------------------------------------------------------------------
# Instruction files (in scope for v0.1)
# ---------------------------------------------------------------------------

[[convention]]
path          = "CLAUDE.md"
kind          = "instruction-file"
import_syntax = "claude-at-import"
tools         = ["Claude Code"]
source        = "https://code.claude.com/docs/en/claude-code/memory"
verified      = "2026-05-29"

[[convention]]
path          = "AGENTS.md"
kind          = "instruction-file"
import_syntax = "plain-pointer"
tools         = ["OpenAI Codex", "Cursor", "GitHub Copilot", "Windsurf", "Aider", "Zed", "Jules", "Devin", "Gemini CLI (opt-in)"]
source        = "https://agents.md/"
verified      = "2026-05-29"
note          = "Linux Foundation / Agentic AI Foundation open standard; read by 25+ tools. Claude Code is NOT on the list (uses CLAUDE.md)."

[[convention]]
path          = "GEMINI.md"
kind          = "instruction-file"
import_syntax = "plain-pointer"
tools         = ["Gemini CLI"]
source        = "https://geminicli.com/docs/cli/gemini-md/"
verified      = "2026-05-29"
note          = "Default filename, configurable via .gemini/settings.json context.fileName. Possibly also used by Google Antigravity per secondary sources (UNVERIFIED)."

[[convention]]
path          = ".github/copilot-instructions.md"
kind          = "instruction-file"
import_syntax = "plain-pointer"
tools         = ["GitHub Copilot"]
source        = "https://docs.github.com/en/copilot/how-tos/configure-custom-instructions/add-repository-instructions"
verified      = "2026-05-29"

[[convention]]
path          = ".claude/CLAUDE.md"
kind          = "instruction-file"
import_syntax = "claude-at-import"
tools         = ["Claude Code"]
source        = "https://code.claude.com/docs/en/claude-code/memory"
verified      = "2026-05-31"

[[convention]]
path          = ".codex/AGENTS.md"
kind          = "instruction-file"
import_syntax = "plain-pointer"
tools         = ["OpenAI Codex"]
source        = "https://github.com/MrShininnnnn/SuperCtx/issues/14"
verified      = "2026-05-31"
note          = "SuperCtx-supported project-local import path for Codex instructions; not an upstream AGENTS.md standard path."

# ---------------------------------------------------------------------------
# Folders (recorded for later phases; OUT OF SCOPE for v0.1 sync)
# ---------------------------------------------------------------------------

[[convention]]
path     = ".claude/"
kind     = "folder"
tools    = ["Claude Code"]
source   = "https://code.claude.com/docs/en/plugins"
verified = "2026-05-29"

[[convention]]
path     = ".gemini/"
kind     = "folder"
tools    = ["Gemini CLI"]
source   = "https://geminicli.com/docs/"
verified = "2026-05-29"

[[convention]]
path     = ".github/instructions/"
kind     = "folder"
tools    = ["GitHub Copilot"]
source   = "https://docs.github.com/en/copilot/how-tos/configure-custom-instructions/add-repository-instructions"
verified = "2026-05-29"

# OPEN VERIFICATION ITEM: Google Antigravity's folder convention.
# Secondary sources indicate ".agents/" (and use of GEMINI.md); the ".agy" and
# ".agy/ANTIGRAVITY.md" claims were NOT confirmed against official docs
# (antigravity.google/docs was not machine-fetchable).
# Also confirm the reported Gemini CLI -> Antigravity 2.0 migration impact before relying.
[[convention]]
path     = ".agents/"
kind     = "folder"
tools    = ["Google Antigravity"]
source   = "https://antigravity.google/docs/home"
verified = ""
note     = "UNVERIFIED — confirm against official Antigravity docs (.agents vs .agy)."

# ---------------------------------------------------------------------------
# Rules and skills (v0.2)
# ---------------------------------------------------------------------------
# `kind`:
#   "rules"  — every file under `path` (recursively) ending in one of `suffixes` is one rule.
#   "skills" — every direct subdirectory of `path` that contains SKILL.md is one skill.
# `canonical` is where an adopted resource lives under .ctx/; it keeps the native
# path's depth, so relative references resolve the same through the link or the target.
# `publish = "link"` means SuperCtx adopts the resource by moving it to `canonical` and
# leaving a relative symlink at the native path. Set it only after the tool's behavior
# through that link has been checked with the real tool (`verified_behavior`). Without
# `publish`, resources are discovered and left in place.

[[convention]]
path              = ".claude/rules/"
kind              = "rules"
suffixes          = [".md"]
canonical         = ".ctx/rules/"
publish           = "link"
tools             = ["Claude Code"]
source            = "https://code.claude.com/docs/en/memory"
verified          = "2026-11-02"
verified_behavior = "Claude Code 2.1.200, macOS: a rule with paths frontmatter, published as a relative file symlink, loads when a matching file is read and stays inactive for a non-matching file (tests/test_real_agents.py)."

[[convention]]
path              = ".claude/skills/"
kind              = "skills"
canonical         = ".ctx/skills/"
publish           = "link"
tools             = ["Claude Code"]
source            = "https://code.claude.com/docs/en/skills"
verified          = "2026-11-02"
verified_behavior = "Claude Code 2.1.200, macOS: a skill published as a relative directory symlink is invoked by name, runs its bundled script, and reads its bundled reference (tests/test_real_agents.py)."

[[convention]]
path      = ".cursor/rules/"
kind      = "rules"
suffixes  = [".mdc", ".md"]
canonical = ".ctx/rules/"
tools     = ["Cursor"]
source    = "https://cursor.com/docs/context/rules"
verified  = "2026-11-02"
note      = "Discovered and left in place: Cursor's rule behavior through links has not been verified (Cursor is not available in the verification environment)."
